name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python }}
      - name: council tests (offline, no API calls)
        run: cd council && python -m unittest -v test_council.py
      - name: secret-guard tests (hook + mask filter)
        run: cd secret-guard && python -m unittest -v test_secret_guard.py
      - name: go-gate tests (classifier + hook flow)
        run: cd go-gate && python -m unittest -v test_go_gate.py
      - name: keeper tests (approvals, forged approvals, socket, daemon down)
        run: cd keeper && python -m unittest -v test_keeper.py
      - name: keeper block-mode dry run (real socket, real hook subprocess, fake local Telegram only)
        run: cd keeper && python -m unittest -v test_block_dryrun.py
      - name: keeper installer (syntax, dry run, install into a temp prefix)
        run: |
          bash -n keeper/install-keeper.sh
          keeper/install-keeper.sh --agent-user "$(id -un)" --owner-id 1
          keeper/install-keeper.sh --agent-user "$(id -un)" --owner-id 1 --prefix /tmp/kp
          python -m json.tool /tmp/kp/etc/claude-code/managed-settings.json >/dev/null
          # the hook entry carries an explicit timeout; a reinstall is idempotent; a wait that cannot fit is refused
          python -c "import json; h=json.load(open('/tmp/kp/etc/claude-code/managed-settings.json'))['hooks']['PreToolUse'][0]['hooks'][0]; assert h['timeout']==60, h"
          cp /tmp/kp/etc/claude-code/managed-settings.json /tmp/kp-first.json
          keeper/install-keeper.sh --agent-user "$(id -un)" --owner-id 1 --prefix /tmp/kp
          cmp /tmp/kp-first.json /tmp/kp/etc/claude-code/managed-settings.json
          if keeper/install-keeper.sh --agent-user "$(id -un)" --owner-id 1 --prefix /tmp/kp2 --wait-max 1800; then exit 1; fi
      - name: docker-proxy tests (no real Docker, no network -- fake run recorder + real local socket)
        run: cd docker-proxy && python -m unittest -v test_docker_proxy.py
      - name: docker-proxy installer (syntax, dry run, wildcard refused, install into a temp prefix)
        run: |
          bash -n docker-proxy/install-docker-proxy.sh
          docker-proxy/install-docker-proxy.sh --agent-user "$(id -un)" --container web-app
          if docker-proxy/install-docker-proxy.sh --agent-user "$(id -un)" --container 'web*'; then exit 1; fi
          docker-proxy/install-docker-proxy.sh --agent-user "$(id -un)" --container web-app --prefix /tmp/dpx
          python -m json.tool /tmp/dpx/etc/docker-proxy/config.json >/dev/null
          python -c "import json; c=json.load(open('/tmp/dpx/etc/docker-proxy/config.json')); assert c['write_allow']['containers']==['web-app'], c"
      - name: keeper server check script (syntax + its own read-only/no-crash self-test; nothing installed in CI)
        run: |
          bash -n keeper/check-keeper-server.sh
          bash keeper/test_check_keeper_server.sh
          keeper/check-keeper-server.sh || true   # exit code depends on the runner's own docker/sudo state, not asserted here
      - name: leak-check tests (fake secrets only)
        run: cd leak-check && python -m unittest -v test_leak_check.py
      - name: leak-check orchestration scripts (syntax + offline run)
        run: bash -n leak-check/contrib/run-server.sh && bash -n leak-check/contrib/run-laptop.sh && bash leak-check/contrib/test_contrib.sh

  hook-gym:
    # External benchmark for Claude Code hooks (https://pypi.org/project/hook-gym/).
    # secret-guard only targets secret leaks, so we report the credentials and secrets categories and our own homelab cases.
    # --hooks and --cases go before "run": placed after it, as the 0.1.0 README shows, the tool only prints its usage.
    # Informational: a partial score does not fail the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: install hook-gym (pinned sdist, checksum verified)
        # The 0.1.0 wheel ships without the built-in cases, so we take the sdist, which has them.
        run: |
          curl -sSLo hook_gym.tar.gz https://files.pythonhosted.org/packages/12/b1/eacec1de5b79272ed09c87106427cf8fd3e8da59bb48c1517a1cdbd7b89e/hook_gym-0.1.0.tar.gz
          echo "0ab3b312b391aba77fa27331fab26de57dbca1eb6f6656c947b5532d5849d52c  hook_gym.tar.gz" | sha256sum -c -
          tar xzf hook_gym.tar.gz -C /tmp
          pip install /tmp/hook_gym-0.1.0
      - name: point a settings file at secret-guard
        run: |
          sed "s#HOOK#$GITHUB_WORKSPACE/secret-guard/secret_guard.py#g" ci/hook-gym-settings.json > /tmp/settings.json
          cat /tmp/settings.json
      - name: hook-gym, built-in credentials cases
        run: hook-gym --hooks /tmp/settings.json --cases /tmp/hook_gym-0.1.0/cases run --tag credentials --tag secrets --report gym-builtin.md 2>&1 | tee gym-builtin.log || true
      - name: hook-gym, homelab cases from this repo
        run: hook-gym --hooks /tmp/settings.json --cases ci/hook-gym-cases run --report gym-homelab.md 2>&1 | tee gym-homelab.log || true
      - name: the harness ran (a missing report fails the job; the score itself stays informational)
        run: test -s gym-builtin.md && test -s gym-homelab.md
      - name: summary
        if: always()
        run: |
          for f in gym-builtin gym-homelab; do
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            if [ -f "$f.md" ]; then cat "$f.md" >> "$GITHUB_STEP_SUMMARY"; else echo '```' >> "$GITHUB_STEP_SUMMARY"; cat "$f.log" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; fi
            line=$(grep -i -m1 -E "overall|error|usage|not found|no hooks|no test" "$f.log" || tail -1 "$f.log")
            echo "::notice title=$f::$line"
          done
