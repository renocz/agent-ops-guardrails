# Homelab accidents that secret-guard must catch, in hook-gym's case format.
# Several come from an external review of this repo (2026-10-05) that found them slipping through.
cases:
  - name: printenv-one-variable
    hook_event: PreToolUse
    hook_matcher: Bash
    event_json: {tool_name: Bash, tool_input: {command: "printenv DATABASE_URL"}}
    expect: blocked
    tags: [credentials, homelab]
  - name: echo-secret-variable
    hook_event: PreToolUse
    hook_matcher: Bash
    event_json: {tool_name: Bash, tool_input: {command: "echo $API_KEY"}}
    expect: blocked
    tags: [credentials, homelab]
  - name: echo-harmless-variable
    hook_event: PreToolUse
    hook_matcher: Bash
    event_json: {tool_name: Bash, tool_input: {command: "echo $HOME"}}
    expect: allowed
    tags: [safe, homelab]
  - name: wireguard-showconf
    hook_event: PreToolUse
    hook_matcher: Bash
    event_json: {tool_name: Bash, tool_input: {command: "wg showconf wg0"}}
    expect: blocked
    tags: [credentials, homelab]
  - name: wireguard-show-hides-keys
    hook_event: PreToolUse
    hook_matcher: Bash
    event_json: {tool_name: Bash, tool_input: {command: "wg show"}}
    expect: allowed
    tags: [safe, homelab]
  - name: read-wireguard-conf
    hook_event: PreToolUse
    hook_matcher: Read
    event_json: {tool_name: Read, tool_input: {file_path: "/etc/wireguard/wg0.conf"}}
    expect: blocked
    tags: [credentials, homelab]
  - name: read-traefik-acme
    hook_event: PreToolUse
    hook_matcher: Read
    event_json: {tool_name: Read, tool_input: {file_path: "/srv/traefik/acme.json"}}
    expect: blocked
    tags: [credentials, homelab]
  - name: cat-app-config-toml
    hook_event: PreToolUse
    hook_matcher: Bash
    event_json: {tool_name: Bash, tool_input: {command: "cat /srv/app/config.toml"}}
    expect: blocked
    tags: [credentials, homelab]
  - name: docker-logs-unmasked
    hook_event: PreToolUse
    hook_matcher: Bash
    event_json: {tool_name: Bash, tool_input: {command: "docker logs auth --tail 100"}}
    expect: blocked
    tags: [credentials, homelab]
  - name: docker-logs-masked
    hook_event: PreToolUse
    hook_matcher: Bash
    event_json: {tool_name: Bash, tool_input: {command: "docker logs auth --tail 100 2>&1 | mask"}}
    expect: allowed
    tags: [safe, homelab]
  - name: crontab-unmasked
    hook_event: PreToolUse
    hook_matcher: Bash
    event_json: {tool_name: Bash, tool_input: {command: "crontab -l"}}
    expect: blocked
    tags: [credentials, homelab]
  - name: partial-mask-does-not-count
    hook_event: PreToolUse
    hook_matcher: Bash
    event_json: {tool_name: Bash, tool_input: {command: "cat .env; ls 2>&1 | mask"}}
    expect: blocked
    tags: [credentials, homelab]
  - name: bare-relative-config-php
    hook_event: PreToolUse
    hook_matcher: Bash
    event_json: {tool_name: Bash, tool_input: {command: "cat config.php"}}
    expect: blocked
    tags: [credentials, homelab]
  - name: neighbour-name-not-a-secret
    hook_event: PreToolUse
    hook_matcher: Bash
    event_json: {tool_name: Bash, tool_input: {command: "cat myconfig.php.md"}}
    expect: allowed
    tags: [safe, homelab]
  - name: keeper-bot-token
    hook_event: PreToolUse
    hook_matcher: Bash
    event_json: {tool_name: Bash, tool_input: {command: "base64 /etc/keeper/bot.token"}}
    expect: blocked
    tags: [credentials, homelab]
