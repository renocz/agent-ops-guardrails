# Example only, not a hardened distribution. Adapt the privilege set to what your own on-call agent actually
# needs, and test it with denial-probe.sh before trusting it. Proxmox's own `pveum` manages roles; this is the
# shape of what you'd define, not something to paste in verbatim.
#
# pveum role add OnCallAgent -privs "VM.Audit,VM.Monitor,Datastore.Audit"
# pveum aclmod /vms/{{VMID}} -user oncall-agent@pve -role OnCallAgent
#
# Deliberately NOT granted: VM.PowerMgmt (start/stop/reset), VM.Config.*, VM.Snapshot, VM.Snapshot.Rollback,
# Datastore.Allocate, Sys.Modify, Sys.PowerMgmt, anything under Permissions.*. The create-only snapshot door
# this role is missing (VM.Snapshot) is deliberately replaced by snapshot-gate/ instead: a separate, root-run
# script the agent can only ever ask, never command directly (see ../snapshot-gate/README.md).
#
# {{VMID}} is a placeholder for the specific container/VM id(s) the on-call agent is actually responsible for
# -- scope the ACL to those, not to the whole cluster.
